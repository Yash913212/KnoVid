<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="surface" x1="8" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202B5D"/>
      <stop offset="1" stop-color="#0D1424"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#surface)" stroke="#8793F2" stroke-opacity=".82"/>
  <g transform="translate(32 32)" fill="none" stroke="#8793F2" stroke-linecap="round">
    <ellipse rx="19" ry="8.5" transform="rotate(34)" stroke-width="1.5" stroke-opacity=".9"/>
    <ellipse rx="19" ry="8.5" transform="rotate(-34)" stroke-width="1.5" stroke-opacity=".45"/>
    <circle r="4.2" fill="#E8B86A" stroke="none" filter="url(#glow)"/>
    <circle cx="16.5" cy="8.5" r="2.2" fill="#2BA6A0" stroke="none"/>
    <circle cx="-16.5" cy="-8.5" r="2" fill="#B8C1FF" stroke="none"/>
  </g>
</svg>
