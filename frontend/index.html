<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnoVid — Watch less. Remember more.</title>
    <meta name="description" content="Turn lectures, interviews, and research videos into searchable transcripts, living knowledge graphs, and grounded study workspaces." />
    <meta name="theme-color" content="#0d1424" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KnoVid" />
    <meta property="og:title" content="KnoVid — Watch less. Remember more." />
    <meta property="og:description" content="Turn lectures, interviews, and research videos into searchable transcripts, living knowledge graphs, and grounded study workspaces." />
    <meta property="og:url" content="https://knovid.app/" />
    <meta property="og:image" content="https://knovid.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KnoVid — Watch less. Remember more." />
    <meta name="twitter:description" content="Turn lectures, interviews, and research videos into searchable transcripts, living knowledge graphs, and grounded study workspaces." />
    <meta name="twitter:image" content="https://knovid.app/og-image.png" />

    <script>
      // Apply theme before first paint to avoid a flash of the wrong palette.
      ;(function () {
        try {
          var t = localStorage.getItem('knovid-theme')
          var dark = t !== 'light'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <style>
      /* Pre-React boot screen — self-replaced by the app on first render. */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fafafa;
      }
      html.dark .boot { background: #08080a; }
      .boot-tile {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        color: #e8b86a;
        background: linear-gradient(145deg, #202b5d, #0d1424);
        border: 1px solid rgba(135, 147, 242, .78);
        box-shadow: 0 0 34px rgba(88, 107, 227, 0.24);
      }
      .boot-mark { display: block; width: 26px; height: 26px; }
      .boot-word {
        font-family: 'Sora', sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #1c1917;
      }
      html.dark .boot-word { color: #fff; }
      .boot-word em { font-family: 'DM Serif Display', Georgia, serif; font-style: italic; font-weight: 400; color: #e8b86a; }
      .boot-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #2ba6a0;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot-loader">
        <div class="boot-tile">
          <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-linecap="round">
              <ellipse cx="16" cy="16" rx="13" ry="5.8" transform="rotate(34 16 16)" stroke-width="1.5" />
              <ellipse cx="16" cy="16" rx="13" ry="5.8" transform="rotate(-34 16 16)" stroke-width="1.5" opacity=".45" />
              <circle cx="16" cy="16" r="3" fill="currentColor" stroke="none" />
              <circle cx="27.5" cy="21.8" r="1.6" fill="#2BA6A0" stroke="none" />
              <circle cx="4.5" cy="10.2" r="1.5" fill="#B8C1FF" stroke="none" />
            </g>
          </svg>
        </div>
        <div class="boot-word">Kno<em>Vid</em></div>
        <div class="boot-dot" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
